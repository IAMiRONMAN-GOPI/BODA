<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>BO A/C Bag Label</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    padding:5px;
    background:#f2f2f2;
}

/* 55mm thermal paper layout */

.container{

    width:55mm;

    margin:auto;

    background:#fff;

    border:2px solid #000;

    padding:5px;

    box-sizing:border-box;

    overflow:hidden;
}

.header{

    text-align:center;

    border-bottom:2px solid #000;

    padding-bottom:5px;

    font-size:18px;

    font-weight:bold;
}

.title{

    font-size:22px;

    font-weight:bold;

    text-decoration:underline;
}

.barcode{

    text-align:center;

    margin:5px 0;
}

.code-text{

    text-align:center;

    font-weight:bold;

    font-size:14px;

    word-break:break-all;
}

.section{

    border-top:2px solid #000;

    padding-top:5px;

    font-size:14px;
}

.label{

    margin:5px 0;

    font-size:14px;

    font-weight:bold;
}

input{

    width:100%;

    border:none;


    font-size:14px;

    text-align:center;



    outline:none;

    box-sizing:border-box;

    background:#fff;
}

button{

    margin-top:10px;

    width:210px;

    padding:12px;

    font-weight:bold;

    border:none;

    border-radius:6px;

    background:#4CAF50;

    color:#fff;

    font-size:16px;

    cursor:pointer;
}

.center{
    text-align:center;
}

.print-hide{
    display:block;
}

@media print{
    .print-hide{
        display:none !important;
    }
}
svg{
    max-width:100%;
    height:auto;
}

</style>
</head>

<body>
<br>
<br>
<div class="container"
     id="printArea">

    <div class="header">

        <div>भारतीय डाक</div>

        <div>India Post</div>

        <div class="title">
            BO A/C BAG
        </div>

        <div style="margin-top:5px;">

            DATE:
            <span id="dateText"></span>

        </div>

    </div>

    <div class="barcode">

        <svg id="barcode"></svg>

    </div>

    <div class="code-text"
         id="codeText"></div>

    <br>

    <div class="section">

        <div class="label">

            TO

            <input type="text"
                   id="soName"
                   placeholder="SO NAME">

        </div>

        <div class="label">

            FROM

            <input type="text"
                   id="boName"
                   placeholder="BO NAME">

        </div>

        <br>

        <div class="label print-hide">

            Last 4 Digits

            <input
        type="text"
        inputmode="numeric"
        pattern="[0-9]*"
        maxlength="4"
        id="suffix"
        placeholder="ENTER LAST 4 DIGITS"
        oninput="this.value=this.value.replace(/[^0-9]/g,'').slice(0,4)"
    >
                     

        </div>

    </div>

</div>

<div class="center">

<button onclick="printLabel()">
PRINT
</button>

</div>

<script>

/* ---------------------- */
/* DATE FORMAT */
/* ---------------------- */

function formatDate(date){

    let d = new Date(date);

    return String(
        d.getDate()
    ).padStart(2,'0')

    +

    String(
        d.getMonth()+1
    ).padStart(2,'0')

    +

    String(
        d.getFullYear()
    ).slice(-2);
}

function displayDate(date){

    let d = new Date(date);

    return String(
        d.getDate()
    ).padStart(2,'0')

    + "/"

    +

    String(
        d.getMonth()+1
    ).padStart(2,'0')

    + "/"

    +

    d.getFullYear();
}

/* ---------------------- */
/* SAVE DATA */
/* ---------------------- */

function saveData(){

    localStorage.setItem(
        "boName",
        boName.value
    );

    localStorage.setItem(
        "soName",
        soName.value
    );

    localStorage.setItem(
        "suffix",
        suffix.value
    );
}

function loadData(){

    boName.value =
    localStorage.getItem(
        "boName"
    ) || "";

    soName.value =
    localStorage.getItem(
        "soName"
    ) || "";

    suffix.value =
    localStorage.getItem(
        "suffix"
    ) || "";
}

/* ---------------------- */
/* BARCODE */
/* ---------------------- */

function generateBarcode(){

    let today =
    new Date();

    let code =

    "BOX"

    +

    formatDate(today)

    +

    suffix.value
    .padStart(4,'0');

    JsBarcode(
        "#barcode",
        code,
        {

            format:"CODE128",

            width:2,

            height:100,

            displayValue:false,

            margin:0
        }
    );

    codeText.innerText =
    code;

    dateText.innerText =
    displayDate(today);

    saveData();
}

/* ---------------------- */
/* USB THERMAL PRINT */
/* ---------------------- */

let printerDevice = null;

async function connectPrinter(){

    const devices =
    await navigator.usb.getDevices();

    if(devices.length > 0){

        printerDevice =
        devices[0];

    }else{

        printerDevice =
        await navigator.usb.requestDevice({
            filters:[]
        });
    }

    await printerDevice.open();

    if(
        printerDevice.configuration
        === null
    ){

        await printerDevice
        .selectConfiguration(1);
    }

    await printerDevice
    .claimInterface(0);
}

/* ---------------------- */
/* CANVAS TO ESC/POS */
/* ---------------------- */

function canvasToEscPosImage(canvas){

    const ctx =
    canvas.getContext("2d");

    let width =
    canvas.width;

    let height =
    canvas.height;

    const imageData =
    ctx.getImageData(
        0,
        0,
        width,
        height
    ).data;

    const bytesPerRow =
    Math.ceil(width / 8);

    let imageBytes = [];

    for(let y=0;y<height;y++){

        for(
            let x=0;
            x<bytesPerRow;
            x++
        ){

            let byte = 0;

            for(
                let bit=0;
                bit<8;
                bit++
            ){

                let px = (

                    y * width +

                    (x*8+bit)

                ) * 4;

                if(
                    px >= imageData.length
                ) continue;

                let r =
                imageData[px];

                let g =
                imageData[px+1];

                let b =
                imageData[px+2];

                let brightness =
                (r+g+b)/3;

                if(brightness < 180){

                    byte |=
                    (0x80 >> bit);
                }
            }

            imageBytes.push(byte);
        }
    }

    const header = [

        0x1D,
        0x76,
        0x30,
        0x00,

        bytesPerRow & 0xFF,
        (bytesPerRow >> 8) & 0xFF,

        height & 0xFF,
        (height >> 8) & 0xFF
    ];

    return new Uint8Array([

        ...header,

        ...imageBytes
    ]);
}

/* ---------------------- */
/* PRINT */
/* ---------------------- */

async function printLabel(){

    try{

        generateBarcode();

        if(
            !printerDevice ||
            !printerDevice.opened
        ){

            await connectPrinter();
        }

        const element =
        document.getElementById(
            "printArea"
        );

        const originalCanvas =
        await html2canvas(
            element,
            {

                scale:2,

                backgroundColor:"#FFFFFF"
            }
        );

        /* 55mm paper */

        const maxWidth = 384;

        /* Max 10cm length */

        const maxHeight = 800;

        const resizedCanvas =
        document.createElement(
            "canvas"
        );

        const ratio =
        Math.min(

            maxWidth /
            originalCanvas.width,

            maxHeight /
            originalCanvas.height
        );

        resizedCanvas.width =
        Math.floor(
            originalCanvas.width *
            ratio
        );

        resizedCanvas.height =
        Math.floor(
            originalCanvas.height *
            ratio
        );

        const resizeCtx =
        resizedCanvas.getContext(
            "2d"
        );

        resizeCtx.fillStyle =
        "#FFFFFF";

        resizeCtx.fillRect(
            0,
            0,
            resizedCanvas.width,
            resizedCanvas.height
        );

        resizeCtx.drawImage(

            originalCanvas,

            0,
            0,

            resizedCanvas.width,

            resizedCanvas.height
        );

        const imageData =
        canvasToEscPosImage(
            resizedCanvas
        );

        const init =
        new Uint8Array([
            0x1B,0x40
        ]);

        const center =
        new Uint8Array([
            0x1B,0x61,0x01
        ]);

        const feed =
        new Uint8Array([
            0x0A,
            0x0A,
            0x0A
        ]);

        const cut =
        new Uint8Array([
            0x1D,
            0x56,
            0x41,
            0x10
        ]);

        const finalData =
        new Uint8Array([

            ...init,

            ...center,

            ...imageData,

            ...feed,

            ...cut
        ]);

        await printerDevice
        .transferOut(
            1,
            finalData
        );

        alert(
            "Printed Successfully"
        );

    }catch(err){

        console.log(err);

        alert(

            "Print Failed\n\n" +

            "Try:\n" +

            "- Enable OTG\n" +

            "- Reconnect printer\n" +

            "- Use Chrome browser\n" +

            "- Try transferOut(2,...)\n" +

            "- Try claimInterface(1)"
        );
    }
}

/* ---------------------- */
/* EVENTS */
/* ---------------------- */

["boName","soName","suffix"]
.forEach(id=>{

    document
    .getElementById(id)

    .addEventListener(
        "input",
        generateBarcode
    );
});

loadData();

generateBarcode();

</script>

</body>
</html>
