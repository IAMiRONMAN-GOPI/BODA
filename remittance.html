<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0">

<title>Cash Remittance Label</title>

<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

<style>

:root{

  /* 55mm thermal paper */

  --paper-width:55mm;

  --border:1.5px solid #000;

  --title-size:18px;
  --text-size:14px;
  --table-size:14px;
}

body{
  font-family:Arial,sans-serif;
  margin:0;
  padding:5px;
  background:#f2f2f2;
}

.container{

  width:var(--paper-width);

  margin:auto;

  background:#fff;

  border:var(--border);

  box-sizing:border-box;

  overflow:hidden;
}

.title{

  text-align:center;

  font-size:var(--title-size);

  font-weight:bold;

  padding:4px;

  border-bottom:var(--border);
}

.section{

  border-bottom:var(--border);

  padding:4px;
}

.label{

  font-size:var(--text-size);

  margin-top:2px;

  font-weight:bold;
}

.nameInput{

  width:100%;

  border:none;

  outline:none;

  text-align:center;

  font-size:var(--text-size);

  padding:2px 0;

  text-transform:uppercase;

  box-sizing:border-box;
}

.dateRow{

  font-size:var(--text-size);

  text-align:center;

  margin-bottom:5px;

  font-weight:bold;
}

.denominationTitle{

  text-align:center;

  font-size:var(--text-size);

  font-weight:bold;

  padding:2px;

  border-bottom:var(--border);
}

table{

  width:100%;

  border-collapse:collapse;
}

td{

  border:1px solid #000;

  padding:2px;

  font-size:var(--table-size);
}

.left{

  width:30%;

  text-align:center;
}

.right{

  width:40%;

  text-align:right;
}

.qtyInput,
.coinInput{

  width:100%;

  border:none;

  outline:none;

  font-size:var(--table-size);

  text-align:center;

  box-sizing:border-box;
}

.totalRow td{

  font-weight:bold;
}

.amountWords{

  margin-bottom:5px;
  padding:6px;

  font-size:var(--text-size);

  border-top:var(--border);
   border-bottom:var(--border);
  text-align:center;

  font-weight:bold;
  height:fit-content;
}

.signatureSpace{

  height: 60px;
}

.footer{

  height:45px;

  position:relative;
}

.stamp{

  position:absolute;

  bottom:5px;

  left:5px;

  font-size:10px;

  color:#777;
}

.sign{

  position:absolute;

  bottom:5px;

  right:5px;

  font-size:10px;

  color:#777;
}

button{

  display:block;

  width:210px;

  margin:10px auto;

  padding:12px;

  border:none;

  background:#4CAF50;

  color:#fff;

  font-size:16px;

  border-radius:6px;
}

@media print{

  button{
    display:none;
  }

  body{
    background:#fff;
  }
}

</style>
</head>

<body>

  <br><br>

<div class="container" id="printArea">

  <div class="title">
    CASH REMITTANCE
  </div>

  <div class="section">

    <div class="dateRow">
      DATE :
      <span id="currentDate"></span>
    </div>

    <div class="label">TO</div>

    <input type="text"
           id="soName"
           class="nameInput"
           placeholder="SO NAME">

    <div class="label">FROM</div>

    <input type="text"
           id="boName"
           class="nameInput"
           placeholder="BO NAME">

  </div>

  <div class="denominationTitle">
    DENOMINATION
  </div>

  <table>

    <tbody id="denominationTable"></tbody>

    <tr class="totalRow">

      <td colspan="2"
          style="text-align:center;">
          TOTAL
      </td>

      <td class="right">
        ₹ <span id="grandTotal">0</span>
      </td>

    </tr>

  </table>

  <div class="amountWords"
       id="amountWords" >

     Zero Rupees only

  </div>

  <div class="signatureSpace" "></div>

  <div class="footer">

    <div class="stamp">
      Date stamp
    </div>

    <div class="sign">
      BPM sign
    </div>

  </div>

</div>

<button onclick="printReceipt()">
PRINT
</button>

<script>

/* ------------------------- */
/* CASH REMITTANCE LOGIC */
/* ------------------------- */

const denominations =
[500,200,100,50,20,10];

const tableBody =
document.getElementById(
  "denominationTable"
);

denominations.forEach(value=>{

  let row =
  document.createElement("tr");

  row.innerHTML = `

    <td class="left">
      ${value} ×
    </td>

    <td>

      <input type="number"
             min="0"
             value=""
             class="qtyInput"
             data-value="${value}">

    </td>

    <td class="right">

      <span id="total${value}">
        0
      </span>

    </td>
  `;

  tableBody.appendChild(row);
});

let coinRow =
document.createElement("tr");

coinRow.innerHTML = `

<td class="left">
COINS
</td>

<td>

<input type="number"
       min="0"
       value=""
       class="coinInput"
       id="coins">

</td>

<td class="right">

<span id="coinTotal">
0
</span>

</td>
`;

tableBody.appendChild(coinRow);

document.addEventListener(
  "input",
  calculateTotal
);

function calculateTotal(){

  let grand = 0;

  document
  .querySelectorAll(".qtyInput")
  .forEach(input=>{

    let value =
    Number(input.dataset.value);

    let qty =
    Number(input.value || 0);

    let total =
    value * qty;

    document.getElementById(
      "total"+value
    ).innerText =
    total.toLocaleString('en-IN');

    grand += total;
  });

  let coins =
  Number(
    document.getElementById(
      "coins"
    ).value || 0
  );

  document.getElementById(
    "coinTotal"
  ).innerText =
  coins.toLocaleString('en-IN');

  grand += coins;

  document.getElementById(
    "grandTotal"
  ).innerText =
  grand.toLocaleString('en-IN');

  document.getElementById(
    "amountWords"
  ).innerText =

  
  numberToWords(grand) + " Rupees " +
  " Only";
}

function setCurrentDate(){

  const d = new Date();

  let day =
  String(d.getDate())
  .padStart(2,'0');

  let month =
  String(d.getMonth()+1)
  .padStart(2,'0');

  let year =
  d.getFullYear();

  document.getElementById(
    "currentDate"
  ).innerText =
  `${day}/${month}/${year}`;
}

setCurrentDate();

function numberToWords(num){

  if(num===0)
  return "Zero";

  const a=[
  "", "One","Two","Three",
  "Four","Five","Six",
  "Seven","Eight","Nine",
  "Ten","Eleven","Twelve",
  "Thirteen","Fourteen",
  "Fifteen","Sixteen",
  "Seventeen","Eighteen",
  "Nineteen"
  ];

  const b=[
  "","","Twenty","Thirty",
  "Forty","Fifty","Sixty",
  "Seventy","Eighty","Ninety"
  ];

  function inWords(n){

    if(n<20)
    return a[n];

    if(n<100)
    return b[Math.floor(n/10)] +
    (n%10 ? " "+a[n%10] : "");

    if(n<1000)
    return a[Math.floor(n/100)] +
    " Hundred " +
    (n%100 ?
    inWords(n%100) : "");

    if(n<100000)
    return inWords(
    Math.floor(n/1000)
    ) + " Thousand " +
    (n%1000 ?
    inWords(n%1000) : "");

    if(n<10000000)
    return inWords(
    Math.floor(n/100000)
    ) + " Lakh " +
    (n%100000 ?
    inWords(n%100000) : "");

    return inWords(
    Math.floor(n/10000000)
    ) + " Crore " +
    (n%10000000 ?
    inWords(n%10000000) : "");
  }

  return inWords(num)
  .replace(/\s+/g,' ')
  .trim();
}

/* ------------------------- */
/* INDEXED DB */
/* ------------------------- */

let db;

const request =
indexedDB.open(
"CashRemittanceDB",
1
);

request.onupgradeneeded =
function(e){

  db = e.target.result;

  db.createObjectStore(
    "settings",
    {keyPath:"id"}
  );
};

request.onsuccess =
function(e){

  db = e.target.result;

  loadSavedData();
};

function saveData(){

  let tx =
  db.transaction(
    "settings",
    "readwrite"
  );

  let store =
  tx.objectStore(
    "settings"
  );

  store.put({

    id:1,

    boName:
    document.getElementById(
      "boName"
    ).value,

    soName:
    document.getElementById(
      "soName"
    ).value
  });
}

function loadSavedData(){

  let tx =
  db.transaction(
    "settings",
    "readonly"
  );

  let store =
  tx.objectStore(
    "settings"
  );

  let req =
  store.get(1);

  req.onsuccess =
  function(){

    if(req.result){

      document.getElementById(
        "boName"
      ).value =
      req.result.boName || "";

      document.getElementById(
        "soName"
      ).value =
      req.result.soName || "";
    }
  };
}

document.getElementById(
"boName"
).addEventListener(
"input",
saveData
);

document.getElementById(
"soName"
).addEventListener(
"input",
saveData
);

/* ------------------------- */
/* USB THERMAL PRINT */
/* ------------------------- */

let printerDevice = null;

async function connectPrinter(){

  const devices =
  await navigator.usb.getDevices();

  if(devices.length > 0){

    printerDevice =
    devices[0];

  }else{

    printerDevice =
    await navigator.usb.requestDevice({
      filters:[]
    });
  }

  await printerDevice.open();

  if(
    printerDevice.configuration
    === null
  ){

    await printerDevice
    .selectConfiguration(1);
  }

  await printerDevice
  .claimInterface(0);
}

function canvasToEscPosImage(canvas){

  const ctx =
  canvas.getContext("2d");

  let width =
  canvas.width;

  let height =
  canvas.height;

  const imageData =
  ctx.getImageData(
    0,
    0,
    width,
    height
  ).data;

  const bytesPerRow =
  Math.ceil(width / 8);

  let imageBytes = [];

  for(let y=0;y<height;y++){

    for(
      let x=0;
      x<bytesPerRow;
      x++
    ){

      let byte = 0;

      for(
        let bit=0;
        bit<8;
        bit++
      ){

        let px =
        (
          y * width +
          (x*8+bit)
        ) * 4;

        if(
          px >= imageData.length
        ) continue;

        let r =
        imageData[px];

        let g =
        imageData[px+1];

        let b =
        imageData[px+2];

        let brightness =
        (r+g+b)/3;

        if(brightness < 128){

          byte |=
          (0x80 >> bit);
        }
      }

      imageBytes.push(byte);
    }
  }

  const header = [

    0x1D,
    0x76,
    0x30,
    0x00,

    bytesPerRow & 0xFF,
    (bytesPerRow>>8)&0xFF,

    height & 0xFF,
    (height>>8)&0xFF
  ];

  return new Uint8Array([

    ...header,

    ...imageBytes
  ]);
}

async function printReceipt(){

  try{

    if(
      !printerDevice ||
      !printerDevice.opened
    ){
      await connectPrinter();
    }

    const element =
    document.getElementById(
      "printArea"
    );

    // Convert HTML to canvas

    const originalCanvas =
    await html2canvas(
      element,
      {

        scale:2,

        backgroundColor:"#FFFFFF"
      }
    );

    // 55mm thermal paper
    // Max height 10cm

    const maxWidth = 384;
    const maxHeight = 800;

    const resizedCanvas =
    document.createElement(
      "canvas"
    );

    const ratio =
    Math.min(

      maxWidth /
      originalCanvas.width,

      maxHeight /
      originalCanvas.height
    );

    resizedCanvas.width =
    Math.floor(
      originalCanvas.width *
      ratio
    );

    resizedCanvas.height =
    Math.floor(
      originalCanvas.height *
      ratio
    );

    const resizeCtx =
    resizedCanvas.getContext(
      "2d"
    );

    resizeCtx.fillStyle =
    "#FFFFFF";

    resizeCtx.fillRect(
      0,
      0,
      resizedCanvas.width,
      resizedCanvas.height
    );

    resizeCtx.drawImage(

      originalCanvas,

      0,
      0,

      resizedCanvas.width,

      resizedCanvas.height
    );

    const imageData =
    canvasToEscPosImage(
      resizedCanvas
    );

    const init =
    new Uint8Array([
      0x1B,0x40
    ]);

    const align =
    new Uint8Array([
      0x1B,0x61,0x01
    ]);

    const feed =
    new Uint8Array([
      0x0A,
      0x0A,
      0x0A
    ]);

    const cut =
    new Uint8Array([
      0x1D,
      0x56,
      0x41,
      0x10
    ]);

    const finalData =
    new Uint8Array([

      ...init,

      ...align,

      ...imageData,

      ...feed,

      ...cut
    ]);

    await printerDevice
    .transferOut(
      1,
      finalData
    );

    alert(
      "Printed Successfully"
    );

  }catch(err){

    console.log(err);

    alert(
      "Print Failed"
    );
  }
}

</script>

</body>
</html>
